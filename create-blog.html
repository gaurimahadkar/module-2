<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Write a story — Inkspire</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body class="dashboard-page"><header class="site-header"><nav class="nav container"><a class="brand" href="index.html"><span class="brand-mark">i</span> inkspire<span class="brand-dot">.</span></a><div class="nav-links"><a href="index.html">Explore</a><a href="dashboard.html">My dashboard</a></div><div class="nav-actions"><a class="btn btn-ghost" href="dashboard.html">← Dashboard</a></div></nav></header><main class="container editor-main"><div class="editor-heading"><span class="eyebrow">THE PAGE IS YOURS</span><h1>Write something <em>meaningful.</em></h1><p class="muted">Don't worry about perfect. Just begin.</p></div><form class="editor-card" id="blogForm"><label>Story title<input id="blogTitle" type="text" maxlength="90" placeholder="Give your story a title..." required></label><div class="form-two"><label>Category<select id="blogCategory" required><option value="">Choose a category</option><option>Technology</option><option>Lifestyle</option><option>Creativity</option><option>Education</option><option>Travel</option></select></label><label>Cover image URL <span class="optional">(optional)</span><input id="blogImage" type="url" placeholder="https://example.com/image.jpg"></label></div><div class="image-preview" id="imagePreview"><span>Cover image preview will appear here</span></div><label>Your story<textarea id="blogContent" rows="12" placeholder="Start writing your thoughts here..." required minlength="20"></textarea></label><div class="editor-footer"><span class="muted" id="wordCount">0 words</span><button class="btn btn-primary" type="submit">Publish story ↗</button></div><p class="form-message" id="blogMessage" aria-live="polite"></p></form></main><script src="js/main.js"></script><script src="js/blog.js"></script></body></html>
